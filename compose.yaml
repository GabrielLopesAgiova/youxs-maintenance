services:
  db:
    image: postgres:18-alpine
    command: ["postgres", "-c", "timezone=America/Sao_Paulo"]
    environment:
      POSTGRES_USER: youxs
      POSTGRES_PASSWORD: youxs
      POSTGRES_DB: youxs
      TZ: America/Sao_Paulo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youxs -d youxs"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - db-data:/var/lib/postgresql
      - ./backend/migrations:/migrations:ro
      - ./docker/postgres/initdb.sh:/docker-entrypoint-initdb.d/initdb.sh:ro

  # Go toolchain: runs the tests and the create-root command (research R13).
  go:
    image: golang:1.26-alpine
    working_dir: /src/backend
    stdin_open: true
    tty: true
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgres://youxs:youxs@db:5432/youxs?sslmode=disable
      TEST_DATABASE_URL: postgres://youxs:youxs@db:5432/youxs_test?sslmode=disable
    volumes:
      - ./backend:/src/backend
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  go-mod-cache:
  go-build-cache:
